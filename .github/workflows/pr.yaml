on:
  pull_request:

name: Pull request checks

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:

  test:
    name: Run tests (app) & build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Run tests
        run: |
          for f in pkg/btbuhlmann pkg/btcountries app ; do
            pushd $f
            flutter pub get
            flutter analyze --fatal-infos
            dart format --output=none --set-exit-if-changed $(find . -name \*.dart -not -name \*.g.dart -not -name \*.pb\*.dart)
            flutter test
            popd
          done

      - name: Build for Android
        run: |
          cd app
          flutter build appbundle \
              --debug --no-pub \
              --build-number="100" \
              --build-name="0.0.1" \
              --dart-define=BUILD="100" \
              --dart-define=BUILDSECONDS="0" \
              --dart-define=GITSHA="aaaaaa" \
              --dart-define=MARKETINGVERSION="0.0.1"

  build-ios:
    name: Build for iOS & macOS
    runs-on: macos-26
    needs:
      - test
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build
        run: |
            cd app
            flutter pub get

            flutter build ipa \
                --release --no-pub --no-codesign \
                --build-number="100" \
                --build-name="0.0.1" \
                --dart-define=BUILD="100" \
                --dart-define=BUILDSECONDS="0" \
                --dart-define=GITSHA="aaaaaa" \
                --dart-define=MARKETINGVERSION="0.0.1"

            flutter build macos \
                --release --no-pub \
                --build-number="100" \
                --build-name="0.0.1" \
                --dart-define=BUILD="100" \
                --dart-define=BUILDSECONDS="0" \
                --dart-define=GITSHA="aaaaaa" \
                --dart-define=MARKETINGVERSION="0.0.1"

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    needs:
      - test
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build Windows executable
        shell: bash
        run: |
          cd app
          flutter pub get
          flutter build windows \
              --release --no-pub \
              --build-number="100" \
              --build-name="0.0.1" \
              --dart-define=BUILD="100" \
              --dart-define=BUILDSECONDS="0" \
              --dart-define=GITSHA="aaaaaa" \
              --dart-define=MARKETINGVERSION="0.0.1"


  build-server:
    name: Build & test admin server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run tests
        run: |
          pushd srv
          go build
          go test ./...
