on:
  pull_request:

name: Pull request checks

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:

  test:
    name: Run tests (app)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Run tests
        run: |
          for f in pkg/btbuhlmann pkg/btcountries app ; do
            pushd $f
            flutter pub get
            flutter analyze --fatal-infos
            dart format --output=none --set-exit-if-changed $(find . -name \*.dart -not -name \*.g.dart -not -name \*.pb\*.dart)
            flutter test
            popd
          done

  build-ios:
    name: Build for iOS
    runs-on: macos-26
    needs:
      - test
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build
        run: |
            cd app
            flutter pub get
            flutter build ipa \
                --release --no-pub --no-codesign \
                --build-number="$BUILD_NUMBER" \
                --build-name="0.0.1" \
                --dart-define=BUILD="$BUILD_NUMBER" \
                --dart-define=BUILDSECONDS="$SOURCE_DATE_EPOCH" \
                --dart-define=GITSHA="$GIT_SHA" \
                --dart-define=MARKETINGVERSION="0.0.1"

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    needs:
      - test
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build Windows executable
        shell: bash
        run: |
          cd app
          flutter pub get
          flutter build windows \
              --release --no-pub \
              --build-number="$BUILD_NUMBER" \
              --build-name="0.0.1" \
              --dart-define=BUILD="$BUILD_NUMBER" \
              --dart-define=BUILDSECONDS="$SOURCE_DATE_EPOCH" \
              --dart-define=GITSHA="$GIT_SHA" \
              --dart-define=MARKETINGVERSION="0.0.1"

  build-server:
    name: Build & test admin server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Run tests
        run: |
          pushd srv
          go test ./...

  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # 1.5.2
        with:
         task_types: '["feat","fix","docs","refactor","chore","build"]'
