on:
    - pull_request
    - push
    - workflow_dispatch

name: Build app

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run tests
        run: |
          for f in pkg/btbuhlmann pkg/btcountries app ; do
            pushd $f
            flutter pub get
            flutter analyze --fatal-infos
            dart format --output=none --set-exit-if-changed $(find . -name \*.dart -not -name \*.g.dart -not -name \*.pb\*.dart)
            flutter test
            popd
          done

  build-macos:
    name: Build for macOS (direct)
    runs-on: macos-26
    if: needs.release-please.outputs.release-created
    environment: release
    needs:
      - test
      - release-please
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build & push
        run: |
          pipx install codemagic-cli-tools
          pushd app
          ./build-macos-direct.sh
        env:
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          AZURE_MAPS_SUBSCRIPTION_KEY: ${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}
          DEVELOPER_ID_APPLICATION_CERT: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT }}
          MAC_APP_DISTRIBUTION_CERT: ${{ secrets.MAC_APP_DISTRIBUTION_CERT }}

      - name: Save artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/bubbletrail*.zip
          retention-days: 1

      ## Now create and publish the appcast

      - name: install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: rclone download
        run: |
          rclone sync minio:updates updates
        env:
          RCLONE_CONFIG_MINIO_TYPE: ${{ secrets.RCLONE_CONFIG_MINIO_TYPE }}
          RCLONE_CONFIG_MINIO_PROVIDER: ${{ secrets.RCLONE_CONFIG_MINIO_PROVIDER }}
          RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_MINIO_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MINIO_REGION: ${{ secrets.RCLONE_CONFIG_MINIO_REGION }}
          RCLONE_CONFIG_MINIO_ENDPOINT: ${{ secrets.RCLONE_CONFIG_MINIO_ENDPOINT }}
          RCLONE_CONFIG_MINIO_ACL: ${{ secrets.RCLONE_CONFIG_MINIO_ACL }}

      - name: Copy new package
        run: |
          cp app/bubbletrail*zip updates

      - name: Generate appcast
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | \
            ./app/macos/Pods/Sparkle/bin/generate_appcast \
            --ed-key-file - updates
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: rclone upload
        run: |
          rclone sync  -v --no-update-modtime updates minio:updates
        env:
          RCLONE_CONFIG_MINIO_TYPE: ${{ secrets.RCLONE_CONFIG_MINIO_TYPE }}
          RCLONE_CONFIG_MINIO_PROVIDER: ${{ secrets.RCLONE_CONFIG_MINIO_PROVIDER }}
          RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_MINIO_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MINIO_REGION: ${{ secrets.RCLONE_CONFIG_MINIO_REGION }}
          RCLONE_CONFIG_MINIO_ENDPOINT: ${{ secrets.RCLONE_CONFIG_MINIO_ENDPOINT }}
          RCLONE_CONFIG_MINIO_ACL: ${{ secrets.RCLONE_CONFIG_MINIO_ACL }}

  build-ios:
    name: Build for iOS (Appstore)
    runs-on: macos-26
    if: needs.release-please.outputs.release-created
    environment: release
    needs:
      - test
      - release-please
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build & push
        run: |
            security create-keychain -p $MATCH_KEYCHAIN_PASSWORD $MATCH_KEYCHAIN_NAME
            security unlock-keychain -p $MATCH_KEYCHAIN_PASSWORD $MATCH_KEYCHAIN_NAME
            security set-keychain-settings -lut 21600 $MATCH_KEYCHAIN_NAME
            security default-keychain -d user -s $MATCH_KEYCHAIN_NAME

            cd app
            flutter pub get
            flutter build ipa \
                --release --no-pub --no-codesign \
                --build-number="$BUILD_NUMBER" \
                --build-name="${{ needs.release-please.outputs.version }}" \
                --dart-define=AZURE_MAPS_SUBSCRIPTION_KEY="$AZURE_MAPS_SUBSCRIPTION_KEY" \
                --dart-define=BUILD="$BUILD_NUMBER" \
                --dart-define=BUILDSECONDS="$SOURCE_DATE_EPOCH" \
                --dart-define=GITSHA="$GIT_SHA" \
                --dart-define=MARKETINGVERSION="${{ needs.release-please.outputs.version }}"

            cd ios
            fastlane push
        env:
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          AZURE_MAPS_SUBSCRIPTION_KEY: ${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_KEYCHAIN_NAME: ${{ runner.temp }}/bubbletrain.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}


  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    if: needs.release-please.outputs.release-created
    environment: release
    needs:
      - test
      - release-please
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build Windows executable
        shell: bash
        run: |
          cd app
          flutter pub get
          flutter build windows \
              --release --no-pub \
              --build-number="$BUILD_NUMBER" \
              --build-name="${{ needs.release-please.outputs.version }}" \
              --dart-define=AZURE_MAPS_SUBSCRIPTION_KEY="$AZURE_MAPS_SUBSCRIPTION_KEY" \
              --dart-define=BUILD="$BUILD_NUMBER" \
              --dart-define=BUILDSECONDS="$SOURCE_DATE_EPOCH" \
              --dart-define=GITSHA="$GIT_SHA" \
              --dart-define=MARKETINGVERSION="${{ needs.release-please.outputs.version }}"
        env:
          AZURE_MAPS_SUBSCRIPTION_KEY: ${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}

      - name: Sign files with Trusted Signing
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\app\build\windows\x64\runner\Release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package Windows build
        shell: pwsh
        run: |
          cd app
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "bubbletrail-windows-$${{ needs.release-please.outputs.version }}-$env:BUILD_NUMBER.zip"

      - name: Save artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/bubbletrail*.zip
          retention-days: 1

  build-android:
    name: Build for Android (Play Store)
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.release-created
    environment: release
    needs:
      - test
      - release-please
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ./.github/actions/build-info

      - name: Build & push
        run: |
            cd app

            echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > android/app/upload-keystore.jks

            flutter pub get
            flutter build appbundle \
                --release --no-pub \
                --build-number="$BUILD_NUMBER" \
                --build-name="${{ needs.release-please.outputs.version }}" \
                --dart-define=AZURE_MAPS_SUBSCRIPTION_KEY="$AZURE_MAPS_SUBSCRIPTION_KEY" \
                --dart-define=BUILD="$BUILD_NUMBER" \
                --dart-define=BUILDSECONDS="$SOURCE_DATE_EPOCH" \
                --dart-define=GITSHA="$GIT_SHA" \
                --dart-define=MARKETINGVERSION="${{ needs.release-please.outputs.version }}"

            mv build/app/outputs/bundle/release/app-release.aab \
              bubbletrail-android-${{ needs.release-please.outputs.version }}-$BUILD_NUMBER.aab
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}

      - name: Save artifacts (Android)
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/bubbletrail*.aab

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.8
          bundler-cache: true
          working-directory: app/android

      - name: Upload app
        shell: bash
        run: |
          cd app/android
          mv ../bubbletrail-android-${{ needs.release-please.outputs.version }}-$BUILD_NUMBER.aab app-release.aab
          echo "$GOOGLE_PLAY_API_KEY_JSON" > fastlane/apikey.json
          bundle exec fastlane deploy
        env:
          GOOGLE_PLAY_API_KEY_JSON: ${{ secrets.GOOGLE_PLAY_API_KEY_JSON }}

  publish-release:
    name: Publish GitHub release
    if: needs.release-please.outputs.release-created
    permissions:
      contents: write
    needs:
      - build-macos
      - build-windows
      - release-please
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1
      - uses: ./.github/actions/build-info

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub releases and push binaries
        run: |
          export GH_PROMPT_DISABLED=1

          # If a release does not yet exist, create one
          if ! gh release view --json name "${{ needs.release-please.outputs.version }}" >/dev/null 2>&1 ; then
            gh release create "${{ needs.release-please.outputs.version }}" \
              --draft \
              --generate-notes \
              --target ${{ github.sha }} \
              --title "${{ needs.release-please.outputs.version }}"
          fi

          # Upload packages to the release
          gh release upload --clobber "${{ needs.release-please.outputs.version }}" \
            packages/*.zip

          # Once packages are uploaded, publish the release
          gh release edit "${{ needs.release-please.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  build-server:
    name: Build admin server
    runs-on: ubuntu-latest
    permissions:
      packages: write
    needs:
      - release-please
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: ko-build/setup-ko@v0.6

      - name: Build & test
        run: |
          pushd srv
          go build
          go test ./...

      - name: Log in to GHCR
        if: needs.release-please.outputs.release-created
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: needs.release-please.outputs.release-created
        run: |
          pushd srv
          ko build --bare --sbom=none -t latest -t "${{ github.run_number }}" .
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}-admin-srv
