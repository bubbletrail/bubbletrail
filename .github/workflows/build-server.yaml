on:
  push:
    branches:
      - main
    paths:
      - 'srv/**'
  workflow_dispatch:

name: Build admin server

jobs:
  build-server:
    name: Build admin server
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: ko-build/setup-ko@v0.6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          pushd srv
          ko build --bare --sbom=none -t latest -t "${{ github.run_number }}" .
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}-admin-srv
